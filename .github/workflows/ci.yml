name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships a running Docker daemon, so the Testcontainers ITs
      # (PipelineAnalyticsTestcontainersIT, PipelineEndpointsIT) actually run
      # here — unlike a laptop without Docker, where they auto-skip. They use a
      # throwaway Postgres and a test-generated signing key, so CI needs no secrets.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
