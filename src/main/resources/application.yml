spring:
  application:
    name: grip-pipeline-service
  threads:
    # Java 21 virtual threads: each blocking request (JDBC, etc.) runs on a
    # cheap virtual thread instead of a pooled platform thread.
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase signs session JWTs with ES256 (asymmetric ECDSA).
          # Keys are fetched from the JWKS endpoint — no secret needed here.
          jwk-set-uri: ${GRIP_JWK_SET_URI:https://pfhptnmeqgmgoevvmywm.supabase.co/auth/v1/.well-known/jwks.json}
          jws-algorithms: ES256
  datasource:
    # Point these at your Supabase Postgres. Use the direct connection (port 5432)
    # or the session pooler; never commit real credentials — supply via env.
    url: ${GRIP_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${GRIP_DB_USER:postgres}
    password: ${GRIP_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # The Grip schema is owned by Supabase migrations. This service only reads;
      # it must never create, alter, or validate-then-mutate the schema.
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

grip:
  cors:
    # Exact origins, comma-separated. Browsers send an Origin with no path, so
    # no trailing slash. Nothing outside this list may call /api from a page.
    allowed-origins: ${GRIP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  reminders:
    # Daily at 08:00. Override for demos, e.g. every minute: "0 * * * * *".
    # Spring's "-" disables the job, which is what a sleeping free-tier
    # instance needs — see ReminderScheduler.
    cron: ${GRIP_REMINDERS_CRON:0 0 8 * * *}
    zone: UTC

management:
  endpoints:
    web:
      exposure:
        # Health only. Never expose env/configprops/loggers: they would print
        # the database password to anyone who can reach the port.
        include: health
  endpoint:
    health:
      # The body is public (the platform health check is unauthenticated), so it
      # stays a bare {"status":"UP"} with no component or database detail.
      show-details: never

springdoc:
  swagger-ui:
    path: /docs

server:
  port: ${PORT:8080}
